# Chốt kỳ số liệu điều hành (#542, migration 1792281604300): lãnh đạo đơn vị gọi thẳng. Hàm tự kiểm vai trò, kỳ
# đã qua, mỗi đơn vị mỗi kỳ một lần; ghi period.closed kèm sha256 vào sổ kiểm toán.
function:
  name: close_period
  schema: office
configuration:
  exposed_as: mutation
  session_argument: hasura_session
permissions:
  - role: director
