# Ứng dụng sinh từ bảng (#560) — trang chung cho mọi bảng người vận hành tạo trong Studio ở schema sinh, cắm vào lõi
# bằng MỘT lệnh như các ứng dụng khác:
#   python3 scripts/moc.py app install apps/sinh/app.yaml     (make app-install APP=apps/sinh/app.yaml)
# Không có máy chủ nghiệp vụ, không bảng riêng, không form viết tay: trang đọc mô tả API PostgREST sinh ở /rest/v1 và
# dựng menu, danh sách, biểu mẫu từ đó. Bảng, cột, quyền nằm trong schema sinh do khung CSDL của lõi quản (#562).
# Container chỉ phục vụ trang tĩnh. Cách dùng: README.md cùng thư mục.

name: sinh
title: Ứng dụng sinh từ bảng
description: Menu, danh sách, biểu mẫu dựng tự động từ các bảng mô tả trong Studio — API do PostgREST sinh
version: 1.0.0
path: /sinh

# Dựng từ thư mục này lúc cài (Dockerfile: Python thư viện chuẩn trên image ghim digest, không root)
image: {build: .}
port: 8080
healthcheck:
  test: [CMD, python3, -c,
         "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/sinh/healthz', timeout=3)"]
  interval: 15s
  timeout: 5s
  retries: 3
memory: 64m

# Manifest bắt buộc có mục database. Trang không có bảng nào của riêng nó, nên schema này để trống. Bảng của các ứng
# dụng sinh nằm ở schema sinh (khung CSDL của lõi làm chủ), không phải ở đây
database:
  schema: trang_sinh
